# Keep working with the lid closed while docked or plugged in.
#
# systemd-logind decides what closing the lid does. With these two lines it
# does nothing when the laptop is docked - a dock or a second screen connected -
# or on mains power, so the session carries on on the external screen and the
# desktop just turns the built-in one off. On battery the lid still suspends,
# through the HandleLidSwitch default.
#
# HandleLidSwitchDocked=ignore is already systemd's default; it is written out
# so a base that changes it does not quietly bring the suspend back.
# HandleLidSwitchExternalPower=ignore covers docks that logind does not count
# as docked, which still leave the laptop on mains power.
#
# The fingerprint reader sits under the lid, so with it closed you log in and
# unlock with your password.
#
# Override it per machine with a later-sorting file in
# /etc/systemd/logind.conf.d/, or delete this one for the stock behaviour.
[Login]
HandleLidSwitchDocked=ignore
HandleLidSwitchExternalPower=ignore
