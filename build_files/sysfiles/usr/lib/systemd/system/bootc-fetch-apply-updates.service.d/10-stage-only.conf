# Fetch and stage updates, but never reboot to apply them.
#
# The stock unit runs "bootc upgrade --apply", which reboots as soon as a new
# image has been staged. The empty ExecStart= below resets the command list -
# without it systemd would append a second command instead of replacing the
# first - and the staged update then goes live at your next reboot, via
# ostree-finalize-staged.service.
#
# Delete this file to get the stock reboot-when-ready behaviour back.
[Service]
ExecStart=
ExecStart=/usr/bin/bootc upgrade --quiet
