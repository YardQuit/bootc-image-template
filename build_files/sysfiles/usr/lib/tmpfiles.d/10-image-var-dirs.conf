# Directories in /var that the packages in this image expect to exist, but do
# not create themselves.
#
# /var is reset on every deployment, so a directory that only exists because an
# RPM created it during the build is gone the moment the image is installed
# somewhere. A well-packaged RPM ships its own tmpfiles.d rule for this (tuned
# does, for /run/tuned); these are the ones that do not, and "bootc container
# lint" lists exactly this set as "content in /var missing systemd tmpfiles.d
# entries".
#
# Add a line here whenever lint names a new one.

d /var/lib/plymouth 0755 root root -
d /var/spool/plymouth 0755 root root -
d /var/lib/tuned 0755 root root -
d /var/log/tuned 0755 root root -
