---
# Dependabot opens a pull request when a GitHub Action used in
# .github/workflows/ has a newer version.
#
# Full reference:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates
version: 2
updates:
  # Only the actions. The base image in the Containerfile is deliberately not
  # watched, though Dependabot's docker ecosystem would match "Containerfile"
  # as well as "Dockerfile" if you added it.
  #
  # It cannot tell a released Fedora from one that has only branched: the tag
  # for the next version exists months before the release, pointing at the same
  # image as "rawhide" and carrying a release-candidate kernel, and Dependabot
  # sees nothing but a higher number. Following that would move the image onto
  # a pre-release without saying so. Watch for new Fedora and CentOS releases
  # yourself and edit the FROM line when you mean to.
  - package-ecosystem: "github-actions"
    directory: "/"          # workflows live in .github/workflows, "/" is correct
    schedule:
      interval: "weekly"
    # Keeps the pull request list short.
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
