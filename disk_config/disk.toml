# Configuration for disk images (qcow2 / raw), used by bootc-image-builder.
#
# Full reference:
# https://github.com/osbuild/bootc-image-builder/blob/main/README.md

# Root filesystem size. Grow it if your image is large.
[[customizations.filesystem]]
mountpoint = "/"
minsize = "20 GiB"

# Only the root filesystem can be sized here, and that is a limit of the
# builder rather than a style choice. Ask for a separate /home and
# bootc-image-builder stops with
#
#   error: cannot generate manifest: the following errors occurred while
#   validating custom mountpoints: path "/home" is not allowed
#
# and the mountpoints it does allow past that check are then dropped by the
# image type's own validation - "blueprint validation failed for image type
# "qcow2": customizations.filesystem: not supported" - which is a line in the
# build log, not a failure. Split /home after installation instead.

# A user to log in with. Without this you get a system you cannot sign in to,
# so keep at least one user (or an SSH key).
#
# "changeme" is a placeholder, not a default: this account is in wheel, so it
# can use sudo, and anything built from an unedited file has a sudo-capable
# login whose password is written down in a public repository.
# scripts/build-disk.sh refuses to build a disk image while it still says
# "changeme" - the ISO is unaffected, because there Anaconda asks for a user
# at install time instead of reading this file.
#
# Three ways out, best first:
#   1. an SSH key and no password at all - uncomment "key" and delete
#      "password";
#   2. a hash rather than the plaintext, so the repository never holds the
#      real password:
#          openssl passwd -6
#      and paste the "$6$..." result as the password value;
#   3. a plaintext password, if the disk image never leaves your machine.
[[customizations.user]]
name = "user"
password = "changeme"
groups = ["wheel"]             # wheel = allowed to use sudo
# key = "ssh-ed25519 AAAA... you@example.com"

# A hostname does not belong here either: bootc-image-builder prints
#
#   blueprint validation failed for image type "qcow2":
#   customizations.hostname: not supported
#
# and then carries on and exits 0, so the setting is dropped and the only sign
# of it is that line scrolling past. Ship one in the image as
# build_files/sysfiles/etc/hostname, or set it per machine afterwards with
# "hostnamectl set-hostname".
